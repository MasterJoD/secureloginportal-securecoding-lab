{% extends "base.html" %}{% block title %}Two-factor verification{% endblock %}{% block body_class %}auth-page{% endblock %}{% block content %}
<section class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card auth-card"><div class="card-body p-4 p-md-5"><h1 class="h3 fw-bold">Two-factor verification</h1><p class="text-muted">Enter the current six-digit code from your authenticator app.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="code">Authenticator code</label><input class="form-control mb-3" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus><button class="btn btn-primary w-100 rounded-pill">Verify and continue</button></form></div></div></div></div></div></section>{% endblock %}
