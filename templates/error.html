{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="py-5 text-center error-section">
  <div class="container">
    <div class="error-code">{{ code }}</div>
    <h1 class="h3 fw-bold">{{ title }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">Back to home</a>
  </div>
</section>
{% endblock %}
