{% extends "base.html" %}{% block title %}Choose new password{% endblock %}{% block body_class %}auth-page{% endblock %}{% block content %}
<section class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card auth-card"><div class="card-body p-4 p-md-5">
<h1 class="h3 fw-bold">Choose a new password</h1>{% for error in errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="password">New password</label><input class="form-control mb-3" type="password" id="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control mb-3" type="password" id="confirm_password" name="confirm_password" maxlength="128" autocomplete="new-password" required><button class="btn btn-primary w-100 rounded-pill">Update password</button></form>
</div></div></div></div></div></section>{% endblock %}
