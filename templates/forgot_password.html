{% extends "base.html" %}{% block title %}Forgot password{% endblock %}{% block body_class %}auth-page{% endblock %}{% block content %}
<section class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card auth-card"><div class="card-body p-4 p-md-5">
<h1 class="h3 fw-bold">Reset your password</h1><p class="text-muted">Enter your registered email. If an account matches, we'll send a time-limited reset link.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="email">Email address</label><input class="form-control mb-3" type="email" id="email" name="email" maxlength="254" required autocomplete="email"><button class="btn btn-primary w-100 rounded-pill">Send reset link</button></form>
<p class="text-center mt-4 mb-0"><a href="{{ url_for('login') }}">Back to login</a></p></div></div></div></div></div></section>{% endblock %}
