{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card auth-card">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-1">Welcome back</h1>
            <p class="text-muted mb-4">Log in to your SecurePortal account.</p>

            <form method="post" action="{{ url_for('login') }}" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" maxlength="254"
                       value="{{ email }}" autocomplete="email" required autofocus>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" name="password" maxlength="128"
                         autocomplete="current-password" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">Show</button>
                </div>
              </div>
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">Keep me signed in for {{ config['REMEMBER_DAYS'] }} days</label>
              </div>
              <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Login</button>
            </form>

            <p class="text-center mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
            <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
